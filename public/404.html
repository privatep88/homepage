<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=./" />
    <title>خدمات ساهر الذكية - جاري التحويل</title>
    <script>
      // Single Page Application redirect for GitHub Pages
      sessionStorage.redirect = location.href;
      var pathSegments = location.pathname.split('/');
      // If deployed under /homepage/
      var base = pathSegments[1] === 'homepage' ? '/homepage/' : '/';
      location.replace(base);
    </script>
  </head>
  <body style="font-family: sans-serif; text-align: center; padding-top: 50px; background-color: #EDF5FF; color: #07162B;">
    <h2>خدمات ساهر الذكية</h2>
    <p>جاري تحويلك إلى الصفحة الرئيسية...</p>
    <a href="./" style="color: #0756AA; font-weight: bold;">اضغط هنا إذا لم يتم تحويلك تلقائياً</a>
  </body>
</html>
